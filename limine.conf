timeout: 3

/Axiom
    protocol: limine
    path: boot():/boot/axiom.elf
    resolution: 1024x768x32

/Axiom text recovery
    protocol: limine
    path: boot():/boot/axiom.elf
    cmdline: recovery
    resolution: 1024x768x32

/Axiom safe mode
    protocol: limine
    path: boot():/boot/axiom.elf
    cmdline: safe
    resolution: 1024x768x32

/Axiom serial recovery (COM1 38400 8N1)
    protocol: limine
    path: boot():/boot/axiom.elf
    cmdline: recovery-serial

