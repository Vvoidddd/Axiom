name: Build

on:
  push:
    branches: [daily, stable]
  pull_request:
    branches: [stable]

permissions:
  contents: read

jobs:
  iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential curl xorriso qemu-system-x86 ovmf
      - name: Build Axiom
        run: ./all
      - name: Check VFS boundaries and failed-save rollback
        run: make test-block test-vfs test-vfs-atomic
      - name: Check ELF permissions, malformed inputs and failed-load cleanup
        run: make test-elf
      - name: Check text input and mouse decoding
        run: make test-input
      - name: Check desktop file saves and terminal boundaries
        run: make test-framebuffer test-picture test-desktop
      - name: Check snapshot validation and interrupted saves
        run: make test-snapshot test-checkpoint
      - name: Check offline data-image backup and restore
        run: python3 tests/data-disk.py
      - name: Check real page-table allocation rollback on BIOS and UEFI
        run: python3 tests/memory.py axiom.iso build/memory-test
      - name: Check authenticated text and serial recovery
        run: python3 tests/recovery.py axiom.iso build/recovery-test
      - name: Check recovery after a broken user-space init
        run: python3 tests/recovery-init.py axiom.iso build/recovery-init-test
      - uses: actions/upload-artifact@v7
        with:
          name: axiom-${{ github.sha }}
          path: axiom.iso
          if-no-files-found: error
