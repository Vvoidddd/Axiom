name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential curl xorriso
      - name: Build Axiom
        run: ./all
      - uses: actions/upload-artifact@v7
        with:
          name: axiom-${{ github.sha }}
          path: axiom.iso
          if-no-files-found: error
